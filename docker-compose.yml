version: '3.8'

services:
  # Development service
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: party-admin-dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: npm run dev
    networks:
      - party-admin-network

  # Production service
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: party-admin-prod
    ports:
      - '8080:80'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - party-admin-network
    profiles:
      - production

networks:
  party-admin-network:
    driver: bridge
